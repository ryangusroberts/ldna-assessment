<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/assets/saunter-mark.svg">
<title>BAIC Sandbox · The Saunter Group</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">

<style>
:root{
  --ground:#EEEFF2; --surface:#FAFAFB; --surface-2:#E7E9ED; --sunken:#E1E4E9;
  --line:#CFD4DC; --line-soft:#DDE1E7;
  --ink:#161B21; --ink-2:#4A5462; --ink-3:#78828F;
  --accent:#9A6B21; --accent-soft:#EFE2CB; --accent-line:#C79B48;
  --critical:#A5352A; --developing:#A56E1F; --established:#256E5E; --strong:#215F80;
  --critical-bg:#F4DFDC; --developing-bg:#F4E7CE; --established-bg:#D8EBE5; --strong-bg:#D7E7F0;
  --flag:#A5352A; --flag-bg:#F6E3E0;
  --shadow:0 1px 2px rgba(22,27,33,.06),0 6px 18px rgba(22,27,33,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0E1216; --surface:#161B21; --surface-2:#1D242B; --sunken:#0A0E11;
    --line:#2B333C; --line-soft:#222A32;
    --ink:#E8EBEF; --ink-2:#A3AEBB; --ink-3:#6F7B88;
    --accent:#D9A441; --accent-soft:#33291494; --accent-line:#8A6A2A;
    --critical:#E3705F; --developing:#DCA84A; --established:#4FB79E; --strong:#5DA6CE;
    --critical-bg:#331A17; --developing-bg:#32270F; --established-bg:#0F2A25; --strong-bg:#122630;
    --flag:#E3705F; --flag-bg:#331A17;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --ground:#0E1216; --surface:#161B21; --surface-2:#1D242B; --sunken:#0A0E11;
  --line:#2B333C; --line-soft:#222A32;
  --ink:#E8EBEF; --ink-2:#A3AEBB; --ink-3:#6F7B88;
  --accent:#D9A441; --accent-soft:#33291494; --accent-line:#8A6A2A;
  --critical:#E3705F; --developing:#DCA84A; --established:#4FB79E; --strong:#5DA6CE;
  --critical-bg:#331A17; --developing-bg:#32270F; --established-bg:#0F2A25; --strong-bg:#122630;
  --flag:#E3705F; --flag-bg:#331A17;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:Archivo,"IBM Plex Sans",system-ui,sans-serif;margin:0;text-wrap:balance;letter-spacing:-.012em}
.mono,code{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
a{color:var(--accent)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ── shell ───────────────────────────────────────────────────────── */
.shell{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
.rail{
  background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:0;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{padding:20px 18px 16px;border-bottom:1px solid var(--line)}
.brand h1{font-size:17px;font-weight:700;letter-spacing:-.02em}
.brand .sub{font-size:11px;color:var(--ink-3);margin-top:3px;letter-spacing:.04em;text-transform:uppercase}
.stamp{
  display:inline-flex;align-items:center;gap:6px;margin-top:11px;padding:3px 8px;
  border:1px solid var(--accent-line);color:var(--accent);background:var(--accent-soft);
  font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:600;
  letter-spacing:.13em;text-transform:uppercase;border-radius:2px;
}
.rail-label{
  padding:16px 18px 7px;font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);font-weight:600;
}
.co{
  display:block;width:100%;text-align:left;padding:11px 18px;border-left:3px solid transparent;
  border-bottom:1px solid var(--line-soft);transition:background .12s;
}
.co:hover{background:var(--surface-2)}
.co[aria-current="true"]{background:var(--surface-2);border-left-color:var(--accent)}
.co .code{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3);letter-spacing:.06em}
.co .nm{font-family:Archivo,sans-serif;font-weight:600;font-size:14px;margin:1px 0 4px}
.co .sec{font-size:11.5px;color:var(--ink-2);line-height:1.3}
.rail-foot{margin-top:auto;padding:16px 18px;border-top:1px solid var(--line);font-size:10.5px;color:var(--ink-3);line-height:1.6}

/* ── top bar ─────────────────────────────────────────────────────── */
.topbar{
  position:sticky;top:0;z-index:20;background:var(--ground);
  border-bottom:1px solid var(--line);padding:12px 30px;
  display:flex;align-items:center;gap:26px;flex-wrap:wrap;
}
.tabs{display:flex;gap:2px}
.tab{
  padding:6px 13px;font-size:12.5px;font-weight:500;border-radius:2px;color:var(--ink-2);
  border:1px solid transparent;
}
.tab:hover{color:var(--ink);background:var(--surface-2)}
.tab[aria-selected="true"]{background:var(--surface);border-color:var(--line);color:var(--ink);font-weight:600}
.seg-wrap{display:flex;align-items:center;gap:9px}
.topbar-spacer{margin-left:auto;font-size:10.5px;color:var(--ink-3);padding-right:120px}
.seg-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.seg{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden;background:var(--surface)}
.seg button{padding:5px 12px;font-size:12px;color:var(--ink-2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground);font-weight:600}

/* ── main ────────────────────────────────────────────────────────── */
main{padding:26px 30px 80px;max-width:1180px}
.eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
section{margin-bottom:26px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow)}
.panel-head{padding:13px 18px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.panel-head h3{font-size:13.5px;font-weight:600}
.panel-head .note{font-size:11.5px;color:var(--ink-3);margin-left:auto}
.panel-body{padding:18px}

/* stepper */
.stepper{display:flex;gap:0;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--surface)}
.step{
  flex:1;padding:11px 15px;text-align:left;border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:2px;transition:background .12s;position:relative;
}
.step:last-child{border-right:none}
.step:hover{background:var(--surface-2)}
.step[aria-current="true"]{background:var(--surface-2)}
.step[aria-current="true"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent)}
.step .t{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;color:var(--accent);letter-spacing:.06em}
.step .l{font-size:12.5px;font-weight:500}
.step .m{font-size:11px;color:var(--ink-3)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:0}
.hero-main{padding:22px 24px;border-right:1px solid var(--line)}
.hero-side{padding:22px 24px;display:flex;flex-direction:column;gap:14px}
.co-title{font-size:24px;font-weight:700;letter-spacing:-.025em}
.co-meta{font-size:12px;color:var(--ink-2);margin-top:3px}
.headline{font-size:15px;font-style:italic;color:var(--ink-2);margin:14px 0 0;border-left:2px solid var(--accent-line);padding-left:12px;line-height:1.5}
.tier-chip{
  display:inline-block;padding:5px 12px;border-radius:2px;font-family:Archivo,sans-serif;
  font-weight:700;font-size:13px;letter-spacing:-.01em;
}
.tier-stabilize_sprint{background:var(--critical-bg);color:var(--critical);border:1px solid var(--critical)}
.tier-build_then_scale{background:var(--developing-bg);color:var(--developing);border:1px solid var(--developing)}
.tier-scale_track{background:var(--established-bg);color:var(--established);border:1px solid var(--established)}
.binding{margin-top:12px;font-size:14px;line-height:1.5}
.binding b{font-weight:600}
.tier-action{font-size:12.5px;color:var(--ink-3);margin-top:5px}
.stat{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-bottom:11px;border-bottom:1px solid var(--line-soft)}
.stat:last-child{border-bottom:none;padding-bottom:0}
.stat .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.stat .v{font-family:"IBM Plex Mono",monospace;font-size:17px;font-weight:500}
.stat .v small{font-size:11px;color:var(--ink-3);font-weight:400}

/* gate banner */
.gate{border:1px solid var(--flag);background:var(--flag-bg);border-radius:4px;padding:14px 18px;display:flex;gap:14px}
.gate.ok{border-color:var(--established);background:var(--established-bg)}
.gate .icon{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:11px;letter-spacing:.1em;color:var(--flag);white-space:nowrap;padding-top:1px}
.gate.ok .icon{color:var(--established)}
.gate h4{font-size:13px;font-weight:600;margin-bottom:3px}
.gate p{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.5}
.gate p+p{margin-top:6px}

/* domain bars */
.bars{display:flex;flex-direction:column;gap:1px}
.bar-row{width:100%;text-align:left;border:1px solid transparent;border-radius:3px;transition:background .12s,border-color .12s;display:grid;grid-template-columns:22px minmax(150px,1.1fr) minmax(0,3fr) 62px;align-items:center;gap:12px;padding:6px 0}
.bar-row:hover{background:var(--surface-2);border-color:var(--line)}
.bar-row[aria-pressed="true"]{background:var(--surface-2);border-color:var(--accent-line)}
.has-more{display:inline-block;margin-left:6px;padding:1px 6px;border:1px solid var(--accent-line);
  border-radius:2px;font-family:"IBM Plex Mono",monospace;font-size:9px;font-weight:600;
  letter-spacing:.09em;text-transform:uppercase;color:var(--accent);vertical-align:middle}
.cp-dot{font-size:15px;line-height:1;text-align:center;color:var(--accent)}
.bar-name{font-size:12.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-name .ns{display:block;font-size:10.5px;color:var(--ink-3);font-weight:400;font-style:italic}
.track{position:relative;height:22px;background:var(--sunken);border-radius:2px;overflow:hidden}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:2px 0 0 2px}
.tick{position:absolute;top:0;bottom:0;width:1px;background:var(--line);opacity:.9}
.bar-score{font-family:"IBM Plex Mono",monospace;font-size:14px;font-weight:600;text-align:right}
.b-critical{background:var(--critical)}.b-developing{background:var(--developing)}
.b-established{background:var(--established)}.b-strong{background:var(--strong)}
.t-critical{color:var(--critical)}.t-developing{color:var(--developing)}
.t-established{color:var(--established)}.t-strong{color:var(--strong)}
.scale-legend{display:grid;grid-template-columns:22px minmax(150px,1.1fr) minmax(0,3fr) 62px;gap:12px;margin-top:6px}
.scale-legend .marks{position:relative;height:14px;font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--ink-3)}
.scale-legend .marks span{position:absolute;transform:translateX(-50%)}

/* ── elevation and motion ──────────────────────────────────────────
   Depth is a three-step scale, not a decoration. Motion is short and
   ease-out: content settles into place rather than sliding around.
   Everything here is disabled wholesale by the reduced-motion rule
   further up, which is why nothing below re-declares it.             */
:root{
  --e1:0 1px 2px rgba(0,0,0,.05), 0 2px 6px rgba(0,0,0,.04);
  --e2:0 2px 4px rgba(0,0,0,.06), 0 12px 28px rgba(0,0,0,.09);
  --e3:0 4px 10px rgba(0,0,0,.08), 0 24px 56px rgba(0,0,0,.14);
  --ease:cubic-bezier(.22,1,.36,1);
}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
main>section{animation:rise .36s var(--ease) both}
main>section:nth-child(2){animation-delay:.05s}
main>section:nth-child(3){animation-delay:.10s}
main>section:nth-child(4){animation-delay:.15s}

.panel{box-shadow:var(--e1);transition:box-shadow .26s var(--ease)}
.tab{position:relative;transition:color .18s var(--ease),background .18s var(--ease)}
.tab::after{
  content:"";position:absolute;left:11px;right:11px;bottom:-1px;height:2px;
  background:var(--accent);transform:scaleX(0);transform-origin:left;
  transition:transform .26s var(--ease);
}
.tab[aria-selected="true"]::after{transform:scaleX(1)}
.fill{transition:width .55s var(--ease)}
.co{transition:background .16s var(--ease),border-left-color .16s var(--ease)}

/* ── the sample library ────────────────────────────────────────────
   Cover-led rather than a list: a prospect recognises a document by
   how it looks before they read its name.                            */
.samp-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));
  gap:22px 18px;padding:20px 18px 22px;
}
.samp-card{
  display:flex;flex-direction:column;text-decoration:none;color:inherit;
  background:var(--surface);border:1px solid var(--line);border-radius:4px;
  overflow:hidden;box-shadow:var(--e1);
  transition:box-shadow .28s var(--ease),transform .28s var(--ease),border-color .28s var(--ease);
}
.samp-card:hover{transform:translateY(-4px);box-shadow:var(--e3);border-color:var(--accent-line)}
.samp-cover{position:relative;background:var(--sunken);padding:14px 14px 0;overflow:hidden}
.samp-cover img{
  display:block;width:100%;height:168px;object-fit:cover;object-position:top center;
  border:1px solid var(--line);border-bottom:0;background:#fff;
  transition:transform .4s var(--ease);
}
.samp-card:hover .samp-cover img{transform:scale(1.03)}
.samp-flag{
  position:absolute;top:21px;right:21px;font-family:"IBM Plex Mono",monospace;
  font-size:8.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--surface);background:var(--accent);padding:3px 7px;border-radius:2px;
}
.samp-body{padding:14px 15px 15px;display:flex;flex-direction:column;flex:1}
.samp-arch{
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;color:var(--accent);
}
.samp-name{font-family:Archivo,sans-serif;font-weight:600;font-size:16px;margin:6px 0 0;letter-spacing:-.012em}
.samp-line{font-size:12px;line-height:1.5;color:var(--ink-2);margin:7px 0 0}
.samp-meta{
  margin-top:auto;padding-top:11px;border-top:1px solid var(--line-soft);
  display:flex;flex-wrap:wrap;gap:3px 12px;
  font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink-3);
}
.samp-open{margin-top:10px;font-size:11.5px;font-weight:600;color:var(--ink-2);transition:color .2s var(--ease)}
.samp-card:hover .samp-open{color:var(--accent)}

/* ── the engagement hero ───────────────────────────────────────────
   The composite is the first number anyone looks for, so it is set
   like a headline rather than buried in a list of five. The caveat
   underneath it does the work of keeping it honest.                  */
.ami-hero{padding:0 0 15px;margin-bottom:13px;border-bottom:1px solid var(--line-soft)}
.ami-hero .k{
  display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);font-weight:600;
}
.ami-hero .n{
  display:block;font-family:Archivo,sans-serif;font-size:60px;font-weight:700;
  letter-spacing:-.045em;line-height:.95;margin-top:6px;font-variant-numeric:tabular-nums;
}
.ami-hero .band{display:block;margin-top:7px;font-size:12px;color:var(--ink-2)}
.ami-hero .band b{font-weight:600;color:var(--ink)}

/* ── radar entrance ────────────────────────────────────────────────
   The shape grows out of the centre rather than appearing. Scaling
   from fill-box centre keeps it registered to the rings behind it.   */
@keyframes radarIn{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:none}}
@keyframes dotIn{from{opacity:0}to{opacity:1}}
svg .radar-now,svg .radar-proj{
  transform-box:fill-box;transform-origin:center;
  animation:radarIn .6s var(--ease) both;
}
svg .radar-proj{animation-delay:.17s}
svg .radar-dot{animation:dotIn .45s var(--ease) both;animation-delay:.34s}

/* ══ the house style ═══════════════════════════════════════════════════
   What made this read as a tool rather than a firm's work was not a lack
   of shadow. It was three things: everything set at the same weight, a
   compressed type scale, and a visible box around every element. This
   block fixes those, in that order.

   1. TYPE — the website's serif (Source Serif 4) carries anything that
      speaks: headings, the company name, the composite, the pull quote.
      The sans stays for interface furniture and the mono for figures.
      That division is what separates an advisory document from a admin
      panel, and it costs one extra font file.
   2. SPACE — padding roughly doubles and moves onto an 8px rhythm.
      Confidence reads as room; density reads as cheap.
   3. SURFACE — panels lose their hairline border and carry one soft
      shadow instead. Fewer visible edges, and the elevation then means
      something because only elevated things have it.
   ═════════════════════════════════════════════════════════════════════ */
:root{--display:"Source Serif 4",Georgia,"Times New Roman",serif}

/* 1 · type */
h1,h2,h3,h4{font-family:var(--display);font-weight:600;letter-spacing:-.016em}
.panel-head h3{font-size:17px;letter-spacing:-.014em}
.co-title{font-family:var(--display);font-size:31px;font-weight:600;letter-spacing:-.022em;line-height:1.1}
.ami-hero .n{font-family:var(--display);font-size:68px;font-weight:600;letter-spacing:-.032em}
.headline{font-family:var(--display);font-size:16.5px;line-height:1.55}
.binding{font-size:14.5px}
.eyebrow,.rail-label,.stat .k,.seg-label{letter-spacing:.2em;font-size:9.5px}
.bar-score,.stat .v,.samp-meta{font-variant-numeric:tabular-nums}
.co .nm{font-family:var(--display);font-size:15.5px;font-weight:600;letter-spacing:-.012em}

/* 2 · space */
main{padding:40px 44px 96px}
section{margin-bottom:38px}
.panel-head{padding:20px 26px 17px}
.panel-body{padding:26px}
.hero-main{padding:32px 34px}
.hero-side{padding:32px 34px;gap:16px}
.samp-grid{padding:26px}
.step{padding:15px 19px}
.gate{padding:20px 24px;gap:16px}
.shell{grid-template-columns:288px minmax(0,1fr)}
.brand{padding:26px 22px 20px}
.rail-label{padding:24px 22px 8px}
.co{padding:15px 22px;border-left:0}
.rail-foot{padding:22px}
.tab{padding:7px 15px}
.topbar{padding:14px 44px}

/* 3 · surface — one soft elevation, no hairline boxes */
.panel{border:0;border-radius:6px;box-shadow:var(--e2)}
.panel-head{border-bottom:1px solid var(--line-soft)}
.hero-main{border-right:1px solid var(--line-soft)}
.stepper{border:0;border-radius:6px;box-shadow:var(--e1)}
.step{border-right:1px solid var(--line-soft)}
.gate{border-radius:6px}
.rail{border-right:1px solid var(--line-soft)}
.co{border-bottom:1px solid var(--line-soft)}
.co[aria-current="true"]{box-shadow:inset 3px 0 0 var(--accent)}

/* 4 · the tier is a statement, not a badge.
   A coloured rule and the firm's serif carry more authority than a
   filled pill, and it stops the page looking like a status dashboard. */
.tier-chip{
  display:inline-block;padding:1px 0 1px 14px;border:0!important;background:none!important;
  border-left:3px solid currentColor!important;border-radius:0;
  font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:-.014em;
}
.tier-stabilize_sprint{color:var(--critical)}
.tier-build_then_scale{color:var(--developing)}
.tier-scale_track{color:var(--established)}

/* ══ 5 · the brand ═════════════════════════════════════════════════════
   The rail goes to the firm's navy and the logo reverses out of it. This
   is the single change that stops the page reading as a generic admin
   surface: the client sees whose instrument this is before they see a
   number, and the brass accent finally has a ground dark enough to earn
   its keep. Navy and brass are the website's own tokens, so the demo and
   the site now look like one practice rather than two projects.        */
:root{--navy:#0E1F3D;--navy-line:rgba(255,255,255,.13);--brass:#C9A24B}
.rail{
  background:var(--navy);border-right:0;color:rgba(255,255,255,.72);
  box-shadow:1px 0 0 rgba(0,0,0,.18), 6px 0 28px rgba(0,0,0,.10);
}
.brand{padding:28px 22px 22px;border-bottom:1px solid var(--navy-line)}
.brand-mark{display:block;height:30px;width:auto;margin-bottom:18px;opacity:.96}
.brand-word{
  font-family:var(--display);font-size:16px;font-weight:600;color:#fff;
  letter-spacing:-.01em;margin-bottom:18px;
}
.brand-rule{width:26px;height:2px;background:var(--brass);margin-bottom:15px}
.brand h1{font-family:var(--display);font-size:19px;font-weight:600;color:#fff;letter-spacing:-.016em}
.brand .sub{
  font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(255,255,255,.5);margin-top:5px;
}
.stamp{
  margin-top:14px;border-color:rgba(201,162,75,.45);color:var(--brass);
  background:rgba(201,162,75,.10);
}
.rail-label{color:rgba(255,255,255,.42);padding:26px 22px 8px}
.co{border-bottom:1px solid var(--navy-line);color:rgba(255,255,255,.72)}
.co:hover{background:rgba(255,255,255,.05)}
.co[aria-current="true"]{background:rgba(255,255,255,.08);box-shadow:inset 3px 0 0 var(--brass)}
.co .code{color:rgba(255,255,255,.42)}
.co .nm{color:#fff}
.co .sec{color:rgba(255,255,255,.58)}
.rail-foot{border-top:1px solid var(--navy-line);color:rgba(255,255,255,.4)}
/* The tier pill in the rail still has to read as a tier, but the band
   colours were mixed for a light ground and go muddy on navy. Each keeps
   its hue as a left rule against a neutral tint instead of a fill. */
.rail .pill{
  background:rgba(255,255,255,.09)!important;border:1px solid rgba(255,255,255,.18)!important;
  color:rgba(255,255,255,.92)!important;padding-left:9px;position:relative;
}
.rail .pill::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:2px 0 0 2px}
.rail .p-critical::before{background:var(--critical)}
.rail .p-high::before{background:var(--developing)}
.rail .p-scale::before{background:var(--established)}
.rail code{background:none;color:rgba(255,255,255,.6)}

/* tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{
  text-align:left;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;
}
td{padding:9px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.pill{
  display:inline-block;padding:2px 7px;border-radius:2px;font-family:"IBM Plex Mono",monospace;
  font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;
}
.p-existential{background:var(--critical);color:var(--surface)}
.p-critical{background:var(--critical-bg);color:var(--critical);border:1px solid var(--critical)}
.p-high{background:var(--developing-bg);color:var(--developing);border:1px solid var(--developing)}
.p-moderate{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.p-scale{background:var(--established-bg);color:var(--established);border:1px solid var(--established)}
.p-low,.p-minimal{background:var(--surface-2);color:var(--ink-3);border:1px solid var(--line)}
.mech{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:12px;color:var(--accent)}
.dim{color:var(--ink-3)}
.tag{
  display:inline-block;padding:1px 6px;margin:1px 3px 1px 0;border:1px solid var(--line);
  border-radius:2px;font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink-2);
}

/* accrual timeline */
.accrual{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.acc-card{border:1px solid var(--line);border-radius:3px;padding:14px;background:var(--surface);
  width:100%;text-align:left;transition:border-color .12s,background .12s}
.acc-card:hover{border-color:var(--accent-line);background:var(--surface-2)}
.acc-card.now{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent-line)}
.acc-card .t{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;color:var(--accent);letter-spacing:.06em}
.acc-card .l{font-size:12.5px;font-weight:600;margin:2px 0 10px}
.acc-row{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;padding:3px 0}
.acc-row .k{color:var(--ink-3)}
.acc-row .v{font-family:"IBM Plex Mono",monospace;font-weight:500}
.acc-verdict{margin-top:9px;padding-top:9px;border-top:1px solid var(--line-soft);font-size:11.5px;line-height:1.45}

/* portfolio */
.pf-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.pf-card{border:1px solid var(--line);border-radius:4px;background:var(--surface);box-shadow:var(--shadow);text-align:left;display:block;width:100%;transition:border-color .12s}
.pf-card:hover{border-color:var(--accent-line)}
.pf-head{padding:15px 17px;border-bottom:1px solid var(--line)}
.pf-body{padding:15px 17px;display:flex;flex-direction:column;gap:9px}
.pf-demo{font-size:12px;color:var(--ink-2);line-height:1.45;font-style:italic}

/* taxonomy */
.fc-group{margin-bottom:16px}
.fc-title{font-size:12px;font-weight:600;padding-bottom:5px;border-bottom:1px solid var(--line);margin-bottom:8px;display:flex;gap:9px;align-items:baseline}
.fc-title .fc{font-family:"IBM Plex Mono",monospace;color:var(--accent);font-size:11px}
.mech-grid{display:grid;gap:5px;grid-template-columns:repeat(auto-fill,minmax(215px,1fr))}
.mech-chip{
  border:1px solid var(--line-soft);border-radius:2px;padding:6px 9px;font-size:11.5px;
  background:var(--surface);line-height:1.35;
}
.mech-chip .id{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink-3);font-weight:600}
.mech-chip.live{border-color:var(--critical);background:var(--critical-bg)}
.mech-chip.live .id{color:var(--critical)}

/* practitioner detail */
.acc-item{border:1px solid var(--line);border-radius:3px;margin-bottom:6px;background:var(--surface)}
.acc-item summary{padding:9px 14px;cursor:pointer;font-size:12.5px;font-weight:500;display:flex;gap:10px;align-items:center;list-style:none}
.acc-item summary::-webkit-details-marker{display:none}
.acc-item summary::before{content:"▸";color:var(--ink-3);font-size:11px}
.acc-item[open] summary::before{content:"▾"}
.acc-item .inner{padding:0 14px 12px;border-top:1px solid var(--line-soft)}
.lens-only{display:none}
body[data-lens="practitioner"] .lens-only{display:block}
body[data-lens="practitioner"] .deliverable-only{display:none}
.disp-legend{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.disp-badge{display:flex;gap:6px;align-items:baseline;border:1px solid var(--line);border-radius:2px;padding:4px 9px;font-size:11px}
.disp-badge .c{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:11px}
.disp-badge .n{color:var(--ink-3)}
.footnote{font-size:11.5px;color:var(--ink-3);line-height:1.55;margin-top:10px}







.story-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px}
.story-k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);
  font-weight:600;margin-bottom:6px}
.story-grid p{margin:0;font-size:13px;line-height:1.6;color:var(--ink-2)}
.story-grid b{color:var(--ink)}

/* ── ELT Diagnostic ──────────────────────────────────────────────────── */
.elt-top{display:grid;grid-template-columns:170px minmax(0,1fr);gap:22px;align-items:start}
.elt-overall{text-align:center;padding:16px 12px;border:1px solid var(--line);border-radius:4px;background:var(--surface-2)}
.elt-overall .k{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.elt-overall .v{font-family:"IBM Plex Mono",monospace;font-size:38px;font-weight:500;line-height:1.1;margin:4px 0}
.elt-overall .b{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2)}
.elt-dims{display:flex;flex-direction:column;gap:11px}
.elt-dim-head{display:flex;align-items:baseline;gap:9px}
.elt-key{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;color:var(--accent)}
.elt-name{font-size:12.5px;font-weight:500}
.elt-w{font-size:10.5px;color:var(--ink-3)}
.elt-score{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:14px;font-weight:600}
.elt-track{position:relative;height:7px;background:var(--sunken);border-radius:2px;overflow:hidden;margin:4px 0 3px}
.elt-track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:2px}
.elt-why{font-size:11.5px;color:var(--ink-3);line-height:1.45}
.elt-findings{margin-top:18px;padding:14px 16px;border:1px solid var(--accent-line);border-radius:4px;background:var(--accent-soft)}
.elt-findings ul{margin:6px 0 0;padding-left:18px}
.elt-findings li{font-size:12.5px;line-height:1.55;margin-bottom:6px}
.ldna-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));margin-top:8px}
.ldna-member{border:1px solid var(--line);border-radius:4px;padding:14px;background:var(--surface)}
.ldna-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ldna-name{font-family:Archivo,sans-serif;font-weight:600;font-size:14px}
.ldna-role{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.ldna-arch{text-align:right}
.arch-chip{display:inline-block;padding:2px 8px;border:1px solid var(--accent-line);color:var(--accent);
  border-radius:2px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600}
.ldna-note{font-size:11.5px;color:var(--ink-2);font-style:italic;margin:8px 0 10px;line-height:1.45}
.ldna-dims{display:flex;flex-direction:column;gap:3px;margin-bottom:9px}
.ldna-row{display:grid;grid-template-columns:22px minmax(0,1fr) 62px;gap:8px;align-items:center}
.ldna-code{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink-3);font-weight:600}
.ldna-track{position:relative;height:9px;background:var(--sunken);border-radius:2px}
.ldna-nat{position:absolute;top:1px;width:3px;height:7px;background:var(--ink-2);border-radius:1px;transform:translateX(-1.5px)}
.ldna-adp{position:absolute;top:1px;width:3px;height:7px;background:var(--accent);border-radius:1px;transform:translateX(-1.5px)}
.ldna-link{position:absolute;top:4px;height:1px;background:var(--accent-line)}
.ldna-val{font-size:10px;color:var(--ink-3);text-align:right}
.ldna-flags{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.flag{font-size:11px;line-height:1.4;padding:4px 8px;border-radius:2px;border-left:2px solid}
.flag.crit{background:var(--critical-bg);border-color:var(--critical);color:var(--critical)}
.flag.warn{background:var(--developing-bg);border-color:var(--developing);color:var(--developing)}
.ldna-vf{font-size:11px;color:var(--ink-3);line-height:1.5;border-top:1px solid var(--line-soft);padding-top:8px}
@media (max-width:940px){.elt-top{grid-template-columns:1fr}}

/* ── multi-unit ──────────────────────────────────────────────────────── */
.unit-tile[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent-line)}
.rank{font-family:"IBM Plex Mono",monospace;font-size:9.5px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--established);border:1px solid var(--established);
  border-radius:2px;padding:1px 5px;vertical-align:middle}
.rank.worst{color:var(--critical);border-color:var(--critical)}
.unit-spark{display:flex;gap:3px;align-items:flex-end;height:34px;margin-bottom:4px}
.us{flex:1;height:100%;background:var(--sunken);border-radius:1px;display:flex;align-items:flex-end}
.us-fill{width:100%;border-radius:1px}
table.heat td.cell{color:var(--surface);font-weight:600;text-align:center;
  border-right:1px solid var(--surface)}
table.heat td.cell.corp{opacity:.45}
table.heat tr.grouprow td{border-top:2px solid var(--line);background:var(--surface-2)}

/* ── tooltips ────────────────────────────────────────────────────────── */
.tip{position:relative;display:inline-flex;align-items:center;justify-content:center;
  width:15px;height:15px;border:1px solid var(--line);border-radius:50%;
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;font-weight:600;
  color:var(--ink-3);cursor:help;flex:none;vertical-align:middle}
.tip:hover,.tip:focus-visible{border-color:var(--accent);color:var(--accent)}
.tip::after{
  content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);right:-6px;
  width:max-content;max-width:320px;padding:9px 11px;border-radius:4px;
  background:var(--ink);color:var(--ground);font-family:"IBM Plex Sans",sans-serif;
  font-size:11.5px;font-weight:400;line-height:1.5;letter-spacing:0;text-align:left;
  white-space:normal;box-shadow:0 4px 14px rgba(0,0,0,.28);
  opacity:0;visibility:hidden;transition:opacity .12s;z-index:60;pointer-events:none}
.tip:hover::after,.tip:focus-visible::after{opacity:1;visibility:visible}
.tip.left::after{right:auto;left:-6px}

/* ── 90-day projection ───────────────────────────────────────────── */
.proj{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:0}
.proj-chart{padding:18px 20px;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:12px}
.proj-legend{display:flex;gap:16px;font-size:11px;color:var(--ink-2)}
.proj-legend i{display:inline-block;width:16px;height:0;border-top:2px solid;vertical-align:middle;margin-right:5px}
.proj-headline{width:100%;border-top:1px solid var(--line-soft);padding-top:12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.proj-headline .k{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.proj-headline .now{font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:500}
.proj-headline .arrow{color:var(--ink-3)}
.proj-headline .to{font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:600;color:var(--accent)}
.proj-headline .delta{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--accent)}
.proj-stamp{display:inline-block;padding:2px 7px;border:1px solid var(--accent-line);color:var(--accent);
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;font-weight:600;letter-spacing:.13em;
  text-transform:uppercase;border-radius:2px}
.proj-list{padding:14px 18px;display:flex;flex-direction:column;gap:4px;max-height:640px;overflow-y:auto}
.presets{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.presets button{padding:4px 10px;font-size:11.5px;border:1px solid var(--line);border-radius:3px;color:var(--ink-2);background:var(--surface)}
.presets button:hover{border-color:var(--accent-line);color:var(--ink)}
.tier-head{font-size:10px;letter-spacing:.13em;text-transform:uppercase;font-weight:600;margin:10px 0 3px;display:flex;gap:8px;align-items:baseline}
.tier-head .n{color:var(--ink-3);font-weight:400;letter-spacing:0;text-transform:none;font-size:11px}
.t-crit{color:var(--critical)} .t-hi{color:var(--developing)}
.t-med{color:var(--ink-2)} .t-lo{color:var(--ink-3)}
.fix{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:10px;align-items:start;
  width:100%;text-align:left;padding:9px 10px;border:1px solid var(--line-soft);border-radius:3px;
  background:var(--surface);transition:border-color .12s,background .12s}
.fix:hover{border-color:var(--accent-line)}
.fix[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line)}
.fix .box{width:14px;height:14px;border:1.5px solid var(--ink-3);border-radius:2px;margin-top:2px;
  display:flex;align-items:center;justify-content:center;font-size:10px;line-height:1;color:var(--surface)}
.fix[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.fix .ttl{font-size:12.5px;font-weight:500;line-height:1.35}
.fix .meta{font-size:10.5px;color:var(--ink-3);margin-top:3px;font-family:"IBM Plex Mono",monospace}
.fix .desc{font-size:11.5px;color:var(--ink-2);margin-top:5px;line-height:1.45}
.fix .gate{font-size:11px;color:var(--ink-2);margin-top:5px;padding-left:9px;border-left:2px solid var(--accent-line)}
.fix .lift{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--accent);white-space:nowrap;padding-top:1px}
.proj-foot{padding:13px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-2);line-height:1.55}
@media (max-width:940px){.proj{grid-template-columns:1fr}.proj-chart{border-right:none;border-bottom:1px solid var(--line)}}

/* ── evidence room ───────────────────────────────────────────────── */
.lib{display:grid;grid-template-columns:250px minmax(0,1fr);gap:0}
.lib-list{border-right:1px solid var(--line);padding:8px 0;background:var(--surface)}
.lib-group{padding:12px 16px 5px;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.doc-btn{display:block;width:100%;text-align:left;padding:8px 16px;font-size:12.5px;border-left:3px solid transparent;color:var(--ink-2)}
.doc-btn:hover{background:var(--surface-2);color:var(--ink)}
.doc-btn[aria-current="true"]{background:var(--surface-2);border-left-color:var(--accent);color:var(--ink);font-weight:600}
.doc-btn .sn{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--accent);margin-left:6px}
.doc{padding:26px 32px;overflow-x:auto}
.doc>*:first-child{margin-top:0}
.doc h1{font-size:22px;font-weight:700;margin:0 0 4px;letter-spacing:-.02em}
.doc h2{font-size:15px;font-weight:600;margin:26px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.doc h3{font-size:13.5px;font-weight:600;margin:18px 0 6px}
.doc h4{font-size:12.5px;font-weight:600;margin:14px 0 4px;color:var(--ink-2)}
.doc p{margin:0 0 11px;max-width:74ch;font-size:13.5px;line-height:1.62}
.doc ul{margin:0 0 12px;padding-left:20px;max-width:74ch}
.doc li{font-size:13.5px;line-height:1.6;margin-bottom:4px}
.doc blockquote{margin:0 0 13px;padding:10px 14px;border-left:2px solid var(--accent-line);background:var(--surface-2);font-size:13px;max-width:74ch}
.doc blockquote p:last-child{margin-bottom:0}
.doc hr{border:none;border-top:1px solid var(--line);margin:20px 0}
.doc table{margin:0 0 14px;font-size:12.5px}
.doc code{background:var(--surface-2);padding:1px 5px;border-radius:2px;font-size:11.5px;border:1px solid var(--line-soft)}
.doc em{color:var(--ink-2)}
.doc-meta{padding:11px 32px;border-bottom:1px solid var(--line);font-size:11.5px;color:var(--ink-3);display:flex;gap:14px;flex-wrap:wrap}

/* ── passphrase gate ─────────────────────────────────────────────── */
.gate-screen{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--ground)}
.gate-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:30px;box-shadow:var(--shadow)}
.gate-card h1{font-size:19px;font-weight:700;letter-spacing:-.02em}
.gate-card .sub{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);margin:4px 0 18px;font-weight:600}
.gate-card p{font-size:12.5px;color:var(--ink-2);line-height:1.55;margin:0 0 18px}
.gate-card input{width:100%;padding:10px 12px;font-family:"IBM Plex Mono",monospace;font-size:13px;background:var(--ground);color:var(--ink);border:1px solid var(--line);border-radius:3px}
.gate-card button.go{width:100%;margin-top:10px;padding:10px;background:var(--ink);color:var(--ground);border-radius:3px;font-weight:600;font-size:13px}
.gate-card button.go:disabled{opacity:.5;cursor:default}
.gate-err{margin-top:10px;font-size:12px;color:var(--flag);min-height:17px}
@media (max-width:940px){.lib{grid-template-columns:1fr}.lib-list{border-right:none;border-bottom:1px solid var(--line)}.doc{padding:20px 16px}}

@media (max-width:940px){
  .shell{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:column}
  .hero{grid-template-columns:1fr}
  .hero-main{border-right:none;border-bottom:1px solid var(--line)}
  .accrual{grid-template-columns:1fr}
  main{padding:20px 16px 60px}
  .topbar{padding:10px 16px}
}

/* the value-stream field */
.field-wrap{margin-top:18px;border:1px solid var(--line);border-radius:6px;
  background:var(--surface);padding:14px 14px 10px}
.field-wrap svg{display:block;width:100%;height:auto}
.field-anchor{fill:none;stroke:var(--line);stroke-width:1.5}

    <div class="brand">
      <img class="brand-mark" src="/assets/saunter-logo-light.svg" alt="The Saunter Group"
           onerror="this.style.display='none';document.getElementById('brandWord').hidden=false">

<script src="./data.js?v=6975d6b3bd65"></script>
<script>
const EMBEDDED = null;

/* The practitioner view — item-level scores, every citation, the evidence
   register and the full arithmetic — is not part of a client build and is not
   in this one. A training build is a separate replication of this page with far
   more context, not a toggle on the client's copy. The `.lens-only` blocks stay
   in the source so that build has somewhere to start. */
const SHOW_PRACTITIONER = false;
let DATA = null;
const S = {view:"portfolio", co:null, snap:"T2", doc:null, lens:"deliverable",
           fixes:new Set(), domain:null, unit:null};
const BANDS = ["critical","developing","established","strong"];
const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money = n => n>=1e6 ? "$"+(n/1e6).toFixed(2)+"M" : n>=1e3 ? "$"+Math.round(n/1e3)+"k" : "$"+Math.round(n);
const pct = n => (n*100).toFixed(1)+"%";
const run = (c,t)=>DATA.runs[c][t];
const co  = c => DATA.companies.find(x=>x.code===c);

const DISP = {
  "R-C":"Received, current","R-S":"Received, stale","A":"Attested only",
  "D":"Declined / not produced","X":"Confirmed non-existent","N":"Not requested"
};

/* ── rail ─────────────────────────────────────────────────────────── */
function renderRail(){
  $("#coList").innerHTML = DATA.companies.map(c=>{
    const r = run(c.code,"T2");
    return `<button class="co" data-co="${c.code}" aria-current="${c.code===S.co}">
      <div class="code">${esc(c.code)}</div>
      <div class="nm">${esc(c.name)}</div>
      <div class="sec">${esc(c.sector)}</div>
      <div style="margin-top:6px"><span class="pill p-${r.tier==="stabilize_sprint"?"critical":r.tier==="build_then_scale"?"high":"scale"}">${esc(r.tierLabel)}</span></div>
    </button>`;
  }).join("");
  $("#railFoot").innerHTML =
    `Engine <code>${esc(DATA.meta.engine)}</code> · framework <code>${esc(DATA.meta.framework)}</code><br>
     Generated ${esc(DATA.meta.generated)}<br><br>
     Every score above item level is computed by the scoring engine, unmodified.
     <br><br>A practitioner build — item-level scores, every citation and the full
     arithmetic — is produced separately. It is not part of a client's copy.`;
}

/* ── portfolio ────────────────────────────────────────────────────── */
function viewPortfolio(){
  const cards = DATA.companies.map(c=>{
    const r = run(c.code,"T2");
    const weak = r.domains.find(d=>d.id===r.weakestCP) || r.domains.filter(d=>d.cp).sort((a,b)=>a.score-b.score)[0];
    return `<button class="pf-card" data-goto="${c.code}">
      <div class="pf-head">
        <div class="code mono dim" style="font-size:10.5px">${esc(c.code)} · ${esc(c.stage)} · ${esc(c.sector)}</div>
        <div style="font-family:Archivo;font-weight:700;font-size:18px;margin:2px 0 9px">${esc(c.name)}</div>
        <span class="tier-chip tier-${r.tier}">${esc(r.tierLabel)}</span>
      </div>
      <div class="pf-body">
        <div class="pf-demo">${esc(c.headline)}</div>
        <div class="stat"><span class="k">Binding reason</span></div>
        <div style="font-size:12.5px;margin-top:-6px">${esc(r.binding)}</div>
        <div class="stat"><span class="k">Total AMI</span><span class="v">${r.ami} <small>± ${r.amiBand}</small></span></div>
        <div class="stat"><span class="k">${r.gateRunway?"Runway":"Weakest critical path"}</span><span class="v" style="font-size:13px">${r.gateRunway?(r.cfPositive?"Cash-flow positive":r.runway.toFixed(1)+" mo"):esc(weak.name)+" "}${r.gateRunway?"":`<span class="t-${weak.band}">${weak.score}</span>`}</span></div>
        <div class="stat"><span class="k">Portfolio exposure</span><span class="v">${money(r.exposure)}</span></div>
        <div class="stat"><span class="k">Report releasable</span><span class="v" style="font-size:13px;color:var(--${r.releasable?"established":"flag"})">${r.releasable?"Yes":"Blocked"}</span></div>
      </div>
    </button>`;
  }).join("");

  return `
  <section>
    <div class="eyebrow">Portfolio · evidence-complete snapshot (T2)</div>
    <h2 style="font-size:22px;margin:5px 0 8px">${DATA.companies.length} companies, ${new Set(DATA.companies.map(x=>run(x.code,"T2").binding.split(":")[0])).size} ways the tier gets set</h2>
    <p style="max-width:66ch;color:var(--ink-2);margin:0 0 18px">
      Between them these ${DATA.companies.length} exercise every branch the v2 tier rule can take: the runway gate,
      a critical-path domain in the Critical band, a critical-path domain in the Developing band,
      a company whose load-bearing functions are all Established but whose Scale Track is blocked
      elsewhere, and one that clears every requirement. If a change to the framework breaks one of
      them, it shows up here.
    </p>
    <p style="max-width:66ch;color:var(--ink-2);margin:0 0 18px">
      The last of those matters as much as the other four. An instrument that returns
      <i>Stabilize Sprint</i> on every company it touches is not measuring anything — it is
      selling. <b>Brandt Precision</b> is the control: same rubric, same engine, same evidence
      discipline, and the report comes back Scale Track with three named risks and no crisis.
    </p>
    <div class="pf-grid">${cards}</div>
  </section>

  <section class="panel">
    <div class="panel-head"><h3>How the tier rule resolved, company by company</h3>
      <span class="note">The two-step tier rule. The composite never decides.</span></div>
    <div class="panel-body tbl-wrap">
      <table>
        <thead><tr><th>Company</th><th>Step 1 — runway gate</th><th>Step 2 — weakest critical path</th><th>Scale Track blockers</th><th class="num">AMI</th><th>Tier</th></tr></thead>
        <tbody>${DATA.companies.map(c=>{
          const r=run(c.code,"T2");
          const weak=r.domains.find(d=>d.id===r.weakestCP);
          return `<tr>
            <td><b>${esc(c.name)}</b><br><span class="dim mono" style="font-size:10.5px">${esc(c.code)}</span></td>
            <td>${r.gateRunway
                 ? `<span class="t-critical"><b>Fires.</b></span> ${r.cfPositive?"":"Runway "+r.runway.toFixed(1)+" mo"}`
                 : `<span class="dim">Clears.</span> ${r.cfPositive?"Cash-flow positive":"Runway "+r.runway.toFixed(1)+" mo"}`}</td>
            <td>${weak?`${esc(weak.name)} <span class="t-${weak.band}"><b>${weak.score}</b> ${esc(weak.bandLabel)}</span>`:'<span class="dim">n/a — gate fired first</span>'}</td>
            <td>${r.blockers.length?r.blockers.map(b=>esc(b)).join("<br>"):'<span class="dim">—</span>'}</td>
            <td class="num">${r.ami}</td>
            <td><span class="pill p-${r.tier==="stabilize_sprint"?"critical":r.tier==="build_then_scale"?"high":"scale"}">${esc(r.tierLabel)}</span></td>
          </tr>`;}).join("")}</tbody>
      </table>
    </div>
  </section>

  <section class="panel lens-only">
    <div class="panel-head"><h3>Reading a register that sums above enterprise value</h3>
      <span class="note">Practitioner lens</span></div>
    <div class="panel-body">
      <div class="tbl-wrap"><table>
        <thead><tr><th>Company</th><th class="num">Portfolio exposure</th><th class="num">Enterprise value</th><th class="num">Ratio</th><th>Reading</th></tr></thead>
        <tbody>${DATA.companies.map(c=>{
          const r=run(c.code,"T2"), ev=r.fin.enterprise_value, ratio=r.exposure/ev;
          return `<tr><td>${esc(c.name)}</td><td class="num">${money(r.exposure)}</td><td class="num">${money(ev)}</td>
            <td class="num ${ratio>1?"t-critical":""}"><b>${ratio.toFixed(2)}×</b></td>
            <td>${ratio>1?"Summed expected loss exceeds the whole business":"Within enterprise value"}</td></tr>`;
        }).join("")}</tbody></table></div>
        <p class="footnote">
          The ratio is not an error signal and the total is not a valuation. The method scores most risks as
          <b>flow losses</b> — expected annual cost against revenue, recurring for as long as the
          mechanism is live — and terminal risks as <b>stock losses</b>, against enterprise value and
          capped there. Summing the two gives the expected annual cost of carrying this risk position.
          A company with several live mechanisms and poor observability can easily carry an annual
          expected loss larger than its sale price; that is the finding, not an artifact of the
          arithmetic.
        </p>
        <p class="footnote">
          Summing is also the right default. Each mechanism is a separate event with a separate cause,
          detectability and mitigation, and the ranking of those is the output — pooling them would
          hide which one to fix first. Overlap between mechanisms is handled where it belongs, in the
          cascade relationships (<code>BAIC_Cascade_Map.md</code>,
          <code>BAIC_DoubleCounting_Map.md</code>), not by capping the total.
          The one open question the spread here does raise is band scaling: Existential at $2M was
          set for smaller firms than most of these
          (<code>BAIC_Criticality_Band_Scaling_PROPOSAL.md</code>).
        </p>
    </div>
  </section>`;
}

/* ── company ──────────────────────────────────────────────────────── */
function stepper(){
  return `<div class="stepper">${DATA.snapshots.map(s=>{
    const r = run(S.co,s.id);
    return `<button class="step" data-snap="${s.id}" aria-current="${s.id===S.snap}">
      <span class="t">${esc(s.id)}</span>
      <span class="l">${esc(s.label)}</span>
      <span class="m">${esc(s.date)} · AMI ${r.ami} · ${r.releasable?"releasable":"withheld"}</span>
    </button>`;}).join("")}</div>`;
}

function gateBanner(r){
  const blocks=[];
  if(!r.tiering) blocks.push(`<p><b>Request coverage ${(r.coverage*100).toFixed(0)}%.</b>
    ${Object.values(r.disp).filter(d=>d==="N").length} rows of the Evidence Request Register are still coded
    <code>N</code> — never asked for. An absence is only evidence if the absence was tested, so a 1 scored on
    one of these rows would record a hole in the <i>request</i>, not in the architecture. Tiering is not permitted.</p>`);
  if(r.provGate) blocks.push(`<p><b>Provisional ${pct(r.provPct)} — above the 20% gate.</b>
    ${r.prov} of ${r.itemCount} items rest on evidence that is self-reported, stale, declined or confirmed absent.
    The report is not releasable at this evidence level.</p>`);
  if(!blocks.length) return `<div class="gate ok"><span class="icon">Gate · clear</span><div>
    <h4>Report releasable</h4>
    <p>Request coverage 100%. Provisional ${pct(r.provPct)}, within the 20% gate.
    ${r.secondAssessor.length?`A second assessor is required on the domain that set the tier: <b>${r.secondAssessor.map(id=>esc((r.domains.find(d=>d.id===id)||{name:id}).name)).join(", ")}</b>.`:""}</p></div></div>`;
  return `<div class="gate"><span class="icon">Gate · held</span><div>
    <h4>This report may not ship on the current evidence</h4>${blocks.join("")}</div></div>`;
}

function domainBars(r){
  const ticks = [40,60,80].map(v=>`<span class="tick" style="left:${v}%"></span>`).join("");
  const rows = [...r.domains].sort((a,b)=>a.score-b.score).map(d=>`
    <button class="bar-row" data-domain="${esc(d.id)}" aria-pressed="${S.domain===d.id}">
      <span class="cp-dot" title="${d.cp?"Critical path — governs the tier":""}">${d.cp?"●":""}</span>
      <span class="bar-name">${esc(d.name)}${d.id==="leadership_capacity" && r.elt
        ? ' <span class="has-more">team read</span>' : ""}<span class="ns">${esc(d.northStar||"")}</span></span>
      <span class="track"><span class="fill b-${d.band}" style="width:${d.score}%"></span>${ticks}</span>
      <span class="bar-score t-${d.band}">${d.score}</span>
    </button>`).join("");
  return `<div class="bars">${rows}</div>
    <div class="scale-legend"><span></span><span></span>
      <span class="marks"><span style="left:0">0</span><span style="left:40%">40 Developing</span>
      <span style="left:60%">60 Established</span><span style="left:80%">80 Strong</span><span style="left:100%">100</span></span>
      <span></span></div>`;
}

function accrual(){
  return `<div class="accrual">${DATA.snapshots.map(s=>{
    const r = run(S.co,s.id);
    return `<button class="acc-card ${s.id===S.snap?"now":""}" data-snap="${esc(s.id)}"
        aria-pressed="${s.id===S.snap}">
      <div class="t">${esc(s.id)}</div>
      <div class="l">${esc(s.label)}</div>
      <div class="acc-row"><span class="k">Tier</span><span class="v t-${r.tier==="stabilize_sprint"?"critical":r.tier==="build_then_scale"?"developing":"established"}">${esc(r.tierLabel)}</span></div>
      <div class="acc-row"><span class="k">Total AMI</span><span class="v">${r.ami} ± ${r.amiBand}</span></div>
      <div class="acc-row"><span class="k">Request coverage</span><span class="v">${(r.coverage*100).toFixed(0)}%</span></div>
      <div class="acc-row"><span class="k">Provisional</span><span class="v ${r.provGate?"t-critical":""}">${pct(r.provPct)}</span></div>
      <div class="acc-row"><span class="k">Risks scored</span><span class="v">${r.risks.length}</span></div>
      <div class="acc-verdict">${r.releasable
        ? '<span class="t-established"><b>Releasable.</b></span> '
        : '<span class="t-critical"><b>Withheld.</b></span> '}${esc(r.snapshot.note)}</div>
    </button>`;}).join("")}</div>`;
}

function riskTable(r){
  const ev = r.fin.enterprise_value;
  const rows = r.risks.map(v=>{
    const mech = DATA.taxonomy.find(m=>m.id===v.id);
    return `<tr>
      <td><span class="mech">${esc(v.id)}</span><br><span class="dim" style="font-size:10.5px">${esc(mech?mech.fc:"")}</span></td>
      <td style="min-width:250px">${esc(mech?mech.name:v.id)}<br><span class="dim" style="font-size:11.5px">${esc(v.desc)}</span></td>
      <td class="lens-only" style="min-width:120px">
        <span class="tag">P ${v.p.toFixed(2)}</span><span class="tag">O ${v.o}</span>
        ${v.amps.map(a=>`<span class="tag">${esc(a.replace(/_/g," "))}</span>`).join("")}
        ${v.pCapped?'<span class="tag t-critical">capped .97</span>':""}
      </td>
      <td class="lens-only"><span class="tag">S ${v.s}</span><br>${money(v.impact)}<br>
        <span class="dim" style="font-size:10.5px">${(v.impactPct*100).toFixed(1)}% of ${v.basis==="revenue"?"revenue":"EV"}</span></td>
      <td class="lens-only"><span class="tag">${esc(v.obsKey)}</span><br>×${v.obsF.toFixed(2)}
        ${v.obsSrc==="domain_default"?'<br><span class="dim" style="font-size:10px">domain default</span>':""}</td>
      <td class="num"><b>${money(v.c)}</b>${v.capped?'<br><span class="dim" style="font-size:10px">capped at VaR</span>':""}
        <span class="lens-only dim" style="font-size:10px">${money(v.cLow)} – ${money(v.cHigh)}</span></td>
      <td><span class="pill p-${v.level}">${esc(v.level)}</span>${v.sa?'<br><span class="dim" style="font-size:10px">2nd assessor</span>':""}</td>
      <td class="deliverable-only" style="min-width:130px"><span class="dim">${esc(v.act)}</span></td>
    </tr>`;}).join("");
  const ratio = r.exposure/ev;
  return `<div class="tbl-wrap"><table>
    <thead><tr><th>Mechanism</th><th>Risk</th>
      <th class="lens-only">Probability</th><th class="lens-only">Impact</th><th class="lens-only">Observability</th>
      <th class="num">Criticality</th><th>Band</th><th class="deliverable-only">Action</th></tr></thead>
    <tbody>${rows}</tbody></table></div>
    <p class="footnote">
      Criticality = Probability × Impact($) × Observability. Total portfolio exposure
      <b>${money(r.exposure)}</b> across ${r.risks.length} scored risks, against an enterprise value of
      ${money(ev)} — <b>${ratio.toFixed(2)}×</b>
      <span class="tip left" tabindex="0" data-tip="${esc(ratio>1
        ? "A register that sums above enterprise value is expected, and correct. Operational risks are flow losses \u2014 expected annual cost against revenue, recurring every year the mechanism stays live. Terminal risks are stock losses \u2014 against enterprise value and capped there. Adding them gives the expected annual cost of the current risk position, which has no reason to sit below the sale price of the company."
        : "This register sits inside enterprise value \u2014 fewer mechanisms live, and better observability on the ones that are.")}">i</span>
    </p>
    <p class="footnote lens-only">
      Summing is the right default because each mechanism is scored as a separate event with its own
      cause, its own detectability and its own mitigation. Pooling them would hide which one to fix
      first, and that ranking is the output. Where two mechanisms describe the same underlying
      failure, the cascade map governs the relationship — that is what prevents double counting,
      not a cap on the total.
    </p>`;
}

function evidenceLedger(r){
  const counts={};
  Object.values(r.disp).forEach(c=>counts[c]=(counts[c]||0)+1);
  const legend = Object.keys(DISP).filter(c=>counts[c]).map(c=>
    `<span class="disp-badge"><span class="c ${c==="R-C"?"t-established":"t-developing"}">${c}</span>
     <span>${esc(DISP[c])}</span><span class="n">${counts[c]} row${counts[c]>1?"s":""}</span></span>`).join("");
  const notCurrent = Object.entries(r.disp).filter(([,c])=>c!=="R-C");
  return `<div class="disp-legend">${legend}</div>
    ${notCurrent.length?`<div class="tbl-wrap"><table>
      <thead><tr><th>Row</th><th>Subdomain</th><th>Disposition</th><th>Effect on scoring</th></tr></thead>
      <tbody>${notCurrent.map(([sid,c])=>{
        const sub = r.domains.flatMap(d=>d.subs).find(s=>s.id===sid);
        const eff = c==="N" ? "Not scorable. Request coverage below 100% — tiering not permitted."
                  : c==="A" ? "Scored, flagged Provisional. Self-report is the floor, not the ceiling."
                  : c==="R-S"? "Scored from the artifact, flagged Provisional — outside its recency window."
                  : c==="X" ? "Scores 1 — absence is evidence. A finding, routed to the 90-Day plan."
                  : "Scores 1. Untested absence — escalate the request or convert to X in writing.";
        return `<tr><td class="mono">${esc(sid)}</td><td>${esc(sub?sub.name:"")}</td>
          <td><b class="mono">${esc(c)}</b> ${esc(DISP[c])}</td><td class="dim">${esc(eff)}</td></tr>`;
      }).join("")}</tbody></table></div>`:'<p class="footnote">Every row received and current.</p>'}`;
}

function itemLedger(r){
  return r.domains.map(d=>`
    <details class="acc-item">
      <summary>${d.cp?'<span class="cp-dot">●</span>':""}
        <span style="flex:1">${esc(d.name)}</span>
        <span class="mono t-${d.band}">${d.score} ${esc(d.bandLabel)}</span></summary>
      <div class="inner tbl-wrap">
        <table><thead><tr><th>Item</th><th>Name</th><th class="num">Score</th><th>Evidence</th><th>Citation</th></tr></thead>
        <tbody>${d.subs.flatMap(s=>s.items.map(i=>`<tr>
          <td class="mono">${esc(i.id)}</td>
          <td>${esc(i.name)}</td>
          <td class="num"><b>${i.s}</b>${i.def?'<br><span class="dim" style="font-size:10px">defaulted</span>':""}${i.prov?'<br><span class="t-developing" style="font-size:10px">provisional</span>':""}</td>
          <td><span class="tag">${esc(i.cls)}</span></td>
          <td class="dim" style="font-size:11px;max-width:340px">${esc(i.cite)}</td>
        </tr>`)).join("")}</tbody></table>
      </div>
    </details>`).join("");
}

function viewCompany(){
  const c = co(S.co), r = run(S.co,S.snap);
  const runwayTxt = r.cfPositive ? "Cash-flow positive"
                  : r.runway==null ? "—" : r.runway.toFixed(1)+" <small>months</small>";
  return `
  <section>${stepper()}</section>

  <section class="panel hero">
    <div class="hero-main">
      <div class="eyebrow">${esc(c.code)} · ${esc(c.sector)} · ${esc(c.stage)} · ${c.employees} staff · ${esc(c.region)}</div>
      <div class="co-title">${esc(c.name)}</div>
      <div class="co-meta">Evidence in hand: ${r.snapshot.sources.map(s=>esc(s)).join(" · ")}</div>
      <div style="margin-top:16px"><span class="tier-chip tier-${r.tier}">${esc(r.tierLabel)}</span></div>
      <div class="binding"><b>Binding reason:</b> ${esc(r.binding)}</div>
      <div class="tier-action">${esc(r.action)}</div>
      <p class="headline">${esc(c.headline)}</p>
    </div>
    <div class="hero-side">

/* ── markdown ─────────────────────────────────────────────────────── */
function inline(t){
  return esc(t)
    .replace(/`([^`]+)`/g,"<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>")
    .replace(/(^|[\s(])\*([^*\n]+)\*/g,"$1<em>$2</em>")
    .replace(/(^|[\s(])_([^_\n]+)_/g,"$1<em>$2</em>");
}
function md2html(src){
  const L = src.replace(/\r/g,"").split("\n");
  const out = []; let i = 0;
  const flushTable = () => {
    const rows = [];
    while(i<L.length && /^\s*\|/.test(L[i])) rows.push(L[i++]);
    if(rows.length<2) return rows.forEach(r=>out.push("<p>"+inline(r)+"</p>"));
    const cells = r => r.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
    const head = cells(rows[0]);
    const body = rows.slice(2).map(cells);
    out.push('<div class="tbl-wrap"><table><thead><tr>'+
      head.map(h=>"<th>"+inline(h)+"</th>").join("")+"</tr></thead><tbody>"+
      body.map(r=>"<tr>"+r.map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>").join("")+
      "</tbody></table></div>");
  };
  while(i<L.length){
    const l = L[i];
    if(/^\s*$/.test(l)){ i++; continue; }
    if(/^\s*\|/.test(l)){ flushTable(); continue; }
    const h = l.match(/^(#{1,4})\s+(.*)$/);
    if(h){ const n=h[1].length; out.push(`<h${n}>${inline(h[2])}</h${n}>`); i++; continue; }
    if(/^(-{3,}|\*{3,})\s*$/.test(l)){ out.push("<hr>"); i++; continue; }
    if(/^>\s?/.test(l)){
      const buf=[]; while(i<L.length && /^>\s?/.test(L[i])) buf.push(L[i++].replace(/^>\s?/,""));
      out.push("<blockquote>"+md2html(buf.join("\n"))+"</blockquote>"); continue;
    }
    if(/^\s*[-*]\s+/.test(l)){
      const buf=[]; while(i<L.length && /^\s*[-*]\s+/.test(L[i])) buf.push(L[i++].replace(/^\s*[-*]\s+/,""));
      out.push("<ul>"+buf.map(b=>"<li>"+inline(b)+"</li>").join("")+"</ul>"); continue;
    }
    const buf=[];
    while(i<L.length && !/^\s*$/.test(L[i]) && !/^\s*\|/.test(L[i]) && !/^#{1,4}\s/.test(L[i])
          && !/^>\s?/.test(L[i]) && !/^\s*[-*]\s+/.test(L[i]) && !/^(-{3,})\s*$/.test(L[i]))
      buf.push(L[i++]);
    out.push("<p>"+inline(buf.join(" "))+"</p>");
  }
  return out.join("\n");
}


/* ── 90-day projection ────────────────────────────────────────────── */
const SHORT = {strategy:"Strategy", systems:"Systems", structure_people:"Structure",
  financial_control:"Financial", gtm_engine:"GTM", data_dashboards:"Data",
  leadership_capacity:"Leadership", risk_compliance:"Risk"};
const bandOf = v => v < 40 ? "critical" : v < 60 ? "developing" : v < 80 ? "established" : "strong";
const bandLabel = v => ({critical:"Critical",developing:"Developing",
  established:"Established",strong:"Strong"})[bandOf(v)];

/* The engine computes every score in this dashboard. This one function is the
   exception, because toggling has to be instant and the engine is Python. It
   reimplements Ref-Doc v2 §2/§3 arithmetic ONLY — subdomain mean x 20, weighted
   to domain, weighted to composite — using the weights the engine emitted, not
   assumed ones. It never touches §5 (tier) or §6 (Criticality). The build ships
   engine-computed checkpoints and verify_projection.mjs fails if this disagrees. */
function projectRun(r, active){
  const targets = {};
  r.fixes.forEach(f => { if(active.has(f.fix_id))
    for(const k in f.impacts) targets[k] = Math.max(targets[k]||0, f.impacts[k]); });
  let ami = 0;
  const domains = r.domains.map(d => {
    let ds = 0;
    d.subs.forEach(s => {
      let sum = 0;
      s.items.forEach(i => sum += Math.max(i.s, targets[i.id] || 0));
      ds += (sum / s.items.length) * 20 * s.w;
    });
    ami += ds * d.w;
    return {id:d.id, name:d.name, cp:d.cp, now:d.raw, proj:ds};
  });
  return {domains, ami};
}

function radarSVG(doms, size){
  const cx = size/2, cy = size/2, R = size*0.33, n = doms.length;
  const pt = (i, v) => {
    const a = -Math.PI/2 + i*2*Math.PI/n, rr = R*Math.max(0, Math.min(100, v))/100;
    return [cx + rr*Math.cos(a), cy + rr*Math.sin(a)];
  };
  const poly = vals => vals.map((v,i)=>pt(i,v).map(x=>x.toFixed(1)).join(",")).join(" ");
  const ring = v => `<polygon points="${poly(doms.map(()=>v))}" fill="none"
      stroke="var(--line)" stroke-width="1"${v<100?' stroke-dasharray="2 3"':''}/>`;
  const axes = doms.map((d,i)=>{
    const [x,y] = pt(i,100);
    return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"
            stroke="var(--line)" stroke-width="1"/>`;
  }).join("");
  const labels = doms.map((d,i)=>{
    const a = -Math.PI/2 + i*2*Math.PI/n;
    const lx = cx + (R+22)*Math.cos(a), ly = cy + (R+22)*Math.sin(a);
    const anchor = Math.abs(Math.cos(a)) < 0.3 ? "middle" : (Math.cos(a) > 0 ? "start" : "end");
    return `<text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}"
      font-size="10.5" font-weight="${d.cp?600:400}"
      fill="${d.cp?'var(--ink)':'var(--ink-3)'}">${esc(SHORT[d.id]||d.name)}${d.cp?" ●":""}</text>`;
  }).join("");
  const moved = doms.some(d => Math.abs(d.proj - d.now) > 0.05);
  return `<svg viewBox="0 0 ${size} ${size}" width="100%" style="max-width:${size}px;overflow:visible"
      role="img" aria-label="Domain scores, evidenced and projected">
    ${[40,60,80,100].map(ring).join("")}${axes}
    <polygon class="radar-now" points="${poly(doms.map(d=>d.now))}" fill="var(--ink-3)" fill-opacity=".14"
      stroke="var(--ink-2)" stroke-width="1.5"/>
    ${moved ? `<polygon class="radar-proj" points="${poly(doms.map(d=>d.proj))}" fill="var(--accent)" fill-opacity=".16"
      stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 3"/>` : ""}
    ${doms.map((d,i)=>{const [x,y]=pt(i,d.proj); const [ax,ay]=pt(i,100);
      return (d.focus?`<line class="radar-dot" x1="${cx}" y1="${cy}" x2="${ax.toFixed(1)}" y2="${ay.toFixed(1)}"
                stroke="var(--accent)" stroke-width="1.5" opacity=".5"/>`:"")
        + `<circle class="radar-dot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${d.focus?4.2:2.6}"
        fill="${d.focus?'var(--accent)':Math.abs(d.proj-d.now)>0.05?'var(--accent)':'var(--ink-2)'}"/>`;}).join("")}
    ${labels}
  </svg>`;
}

function tierMeta(t){
  return {critical:{cls:"t-crit",label:"Critical"}, high:{cls:"t-hi",label:"High"},
          medium:{cls:"t-med",label:"Medium"}, low:{cls:"t-lo",label:"Low"}}[t];
}

function viewProjection(r){
  const p = projectRun(r, S.fixes);
  const base = projectRun(r, new Set());
  const amiNow = Math.round(base.ami), amiProj = Math.round(p.ami);
  const nOn = S.fixes.size;

  const rows = ["critical","high","medium","low"].map(t=>{
    const list = r.fixes.filter(f=>f.tier===t);
    if(!list.length) return "";
    const m = tierMeta(t);
    return `<div class="tier-head ${m.cls}">${m.label}
        <span class="n">${list.length} action${list.length>1?"s":""}</span></div>` +
      list.map(f=>{
        const on = S.fixes.has(f.fix_id);
        const solo = r.projection.byFix[f.fix_id];
        const lift = Math.round(solo.ami) - amiNow;
        const tip = `${f.fix_id} · sprint ${f.sprint} (days ${(f.sprint-1)*30+1}\u2013${f.sprint*30})`
                  + ` · owner ${f.owner} · retires ${f.risk_ref}`
                  + `  —  Done when: ${f.gate}`;
        return `<button class="fix" data-fix="${esc(f.fix_id)}" aria-pressed="${on}">
          <span class="box">${on?"✓":""}</span>
          <span>
            <span class="ttl">${esc(f.title)}
              <span class="tip" tabindex="0" data-tip="${esc(tip)}">i</span></span>
            <span class="desc">${esc(f.description)}</span>
          </span>
          <span class="lift">${lift>0?"+"+lift:"—"}</span>
        </button>`;
      }).join("");
  }).join("");

  // What would actually move the tier — and what would not.
  let moves;
  if(r.gateRunway){
    const cash = r.fixes.find(f=>f.tier==="critical" && /burn|runway|cash/i.test(f.title));
    moves = `The binding reason here is the <b>runway gate</b>, and no domain score moves it —
      only cash does. ${cash?`<b>${esc(cash.fix_id)} ${esc(cash.title)}</b> is the one action in this
      register that would, and its gate is written to say so.`:""}
      Everything else on this list improves the architecture underneath a company that still has
      ${r.runway.toFixed(1)} months of runway.`;
  } else {
    const cp = p.domains.filter(d=>d.cp);
    const changed = cp.filter(d=>bandOf(d.proj)!==bandOf(d.now));
    const weakestNow = cp.slice().sort((a,b)=>a.now-b.now)[0];
    moves = changed.length
      ? `Fully evidenced, this would move ${changed.map(d=>`<b>${esc(d.name)}</b> from
         ${bandLabel(d.now)} to ${bandLabel(d.proj)}`).join(", and ")} — which is what the tier
         turns on. It does not move today: a projection is not evidence, and the gate column is
         what would have to be true.`
      : `This lifts the shape without changing the band of any critical-path domain.
         ${esc(weakestNow.name)} stays ${bandLabel(weakestNow.proj)}, so the tier holds even on
         the full register.`;
  }

  return `
  <section class="panel">
    <div class="panel-head"><h3>90-Day Action Architecture</h3>
      <span class="note">Click an action to project it. ${nOn} of ${r.fixes.length} selected.</span></div>
    <div class="panel-body proj" style="padding:0">
      <div class="proj-chart">
        ${radarSVG(p.domains, 340)}
        <div class="proj-legend">
          <span><i style="border-color:var(--ink-2)"></i>Evidenced today</span>
          <span><i style="border-color:var(--accent);border-top-style:dashed"></i>Projected</span>
        </div>
        <div class="proj-headline">
          <span class="k">Total AMI</span>
          <span class="now">${amiNow}</span>
          <span class="arrow">→</span>
          <span class="to">${amiProj}</span>
          <span class="delta">${amiProj-amiNow>0?"+"+(amiProj-amiNow):"no change"}</span>
          <span class="proj-stamp" style="margin-left:auto">Projected</span>
        </div>
      </div>
      <div class="proj-list">
        <div class="presets">
          <button data-fixset="none">Clear</button>
          <button data-fixset="critical">Critical only</button>
          <button data-fixset="high">Critical + High</button>
          <button data-fixset="all">Everything</button>
        </div>
        ${rows}
      </div>
    </div>
    <div class="proj-foot">
      <p style="margin:0 0 8px">${moves}</p>
      <p style="margin:0;font-size:11.5px;color:var(--ink-3)">
        Projections apply each action's target scores to the AMI items it lifts and recompute
        domain scores with the engine's own weights. They never lower a score, they never move
        the tier or the Criticality figures, and they are labelled projected everywhere they
        appear. A score requires evidence in hand; this is a forecast of what the score becomes
        once the gate is met.</p>
    </div>
  </section>`;
}




/* ── best practice already in the building ────────────────────────────── */
function transferPanel(us, cfg){
  const own = us[0].domains.filter(d => !d.corp).map(d => d.id);
  const rows = own.map(id => {
    const ranked = [...us].sort((a,b) =>
      b.domains.find(d=>d.id===id).raw - a.domains.find(d=>d.id===id).raw);
    const best = ranked[0], worst = ranked[ranked.length-1];
    const bD = best.domains.find(d=>d.id===id), wD = worst.domains.find(d=>d.id===id);
    const gap = bD.score - wD.score;

    // the subdomain carrying most of the gap, and the items inside it
    let topSub = null, topGap = -1;
    bD.subs.forEach(bs => {
      const ws = wD.subs.find(x=>x.id===bs.id);
      if(ws && bs.score - ws.score > topGap){ topGap = bs.score - ws.score; topSub = {bs, ws}; }
    });
    const items = topSub ? topSub.bs.items
      .map(bi => ({bi, wi: topSub.ws.items.find(x=>x.id===bi.id)}))
      .filter(p => p.wi && p.bi.s - p.wi.s >= 2)
      .map(p => `${esc(p.bi.name)} (${p.wi.s} → ${p.bi.s})`) : [];

    return {id, name: bD.name, best, worst, gap, bD, wD, topSub, topGap, items};
  }).sort((a,b) => b.gap - a.gap);

  return `
  <section class="panel">
    <div class="panel-head"><h3>The answer is already in the building</h3>
      <span class="note">Where one ${esc(cfg.noun)} has solved what another has not</span></div>
    <div class="panel-body">
      <p class="footnote" style="margin:0 0 14px">
        Every domain below is scored at the ${esc(cfg.noun)}, on the same rubric, in the same
        week. Where the spread is wide, the gap is not a knowledge problem — somebody in this
        business already does it well. That makes it a transfer job, and transfer is faster and
        cheaper than anything bought in.
      </p>
      <div class="tbl-wrap"><table>
        <thead><tr><th>Domain</th><th>Best</th><th>Weakest</th><th class="num">Spread</th>
          <th>What to move, and from where</th></tr></thead>
        <tbody>${rows.map(r => `<tr>
          <td><b>${esc(r.name)}</b>${r.bD.cp ? ' <span class="cp-dot">●</span>' : ''}</td>
          <td>${esc(r.best.name)} <span class="t-${r.bD.band}">${r.bD.score}</span></td>
          <td>${esc(r.worst.name)} <span class="t-${r.wD.band}">${r.wD.score}</span></td>
          <td class="num"><b class="${r.gap >= 20 ? 't-critical' : ''}">${r.gap}</b></td>
          <td>${r.topSub && r.topGap > 0
              ? `<b>${esc(r.topSub.bs.name)}</b> — ${esc(r.best.name)} ${r.topSub.bs.score},
                 ${esc(r.worst.name)} ${r.topSub.ws.score}.
                 ${r.items.length
                   ? `Specifically: ${r.items.join("; ")}.`
                   : "The gap is spread evenly across the items rather than sitting in one practice."}`
              : `<span class="dim">No meaningful spread — every ${esc(cfg.noun)} is in the same place.</span>`}</td>
        </tr>`).join("")}</tbody></table></div>
      <p class="footnote">
        ${(() => {
          const w = rows[0];
          return w && w.gap >= 15
            ? `The widest gap is <b>${esc(w.name)}</b> — ${w.gap} points between
               ${esc(w.best.name)} and ${esc(w.worst.name)}. That is the first transfer to run,
               and ${esc(w.best.name)} is where the working version lives.`
            : `No domain shows a wide enough spread to make transfer the first move — these
               ${esc(cfg.label)} are consistent, and the gaps that remain are group-level.`;
        })()}
      </p>
    </div>
  </section>`;
}

      no single ${esc(cfg.noun)} can fix, and two of them are already running well enough
      to grow on.</p>
    <div class="pf-grid">${sorted.map(u=>unitTile(u,best,worst)).join("")}</div>
  </section>

  ${S.unit ? viewUnitDetail(us.find(u=>u.id===S.unit), c, cfg) : ""}

  ${transferPanel(sorted, cfg)}

  <section class="panel">
    <div class="panel-head"><h3>Every ${esc(cfg.noun)}, every domain</h3>
      <span class="note">Shaded columns are scored once at group level and inherited · ● critical path</span></div>
    <div class="panel-body">${heat}

      <p class="footnote">

        discipline and is not judged for it. Everything that varies is something a
        ${esc(cfg.noun)} actually controls.</p>

  </section>`;
}

  const bars = [...u.domains].sort((a,b)=>a.score-b.score).map(d=>`
    <div class="bar-row" style="cursor:default">
      <span class="cp-dot">${d.cp?"●":""}</span>
      <span class="bar-name">${esc(d.name)}
        <span class="ns">${d.corp?"group-level — inherited, not scored here"
                                 :esc(d.northStar||"")}</span></span>
      <span class="track"><span class="fill b-${d.band}" style="width:${d.score}%;
        ${d.corp?"opacity:.45":""}"></span>${ticks}</span>
      <span class="bar-score t-${d.band}">${d.score}</span>

      <h3>${esc(u.name)}</h3>

        <div style="margin-bottom:14px"><span class="tier-chip tier-${u.tier}">${esc(u.tierLabel)}</span></div>
        <div class="binding"><b>Binding reason:</b> ${esc(u.binding)}</div>
        <div class="tier-action">${esc(u.action)}</div>
        <p class="headline">${esc(u.unit.note)}</p>
        <p class="footnote" style="margin-top:14px">
          The runway gate is not evaluated at ${esc(cfg.noun)} level. Liquidity is a group
          property — a ${esc(cfg.noun)} cannot be default-dead on its own money because it
          does not hold its own money. The tier here comes from the weakest load-bearing

      </div>
      <div class="hero-side">
        <div class="stat"><span class="k">Overall</span><span class="v">${u.ami} <small>± ${u.amiBand} · ${esc(u.amiBandLabel)}</small></span></div>
