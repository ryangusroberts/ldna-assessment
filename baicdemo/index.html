/* ── domain drill-down ────────────────────────────────────────────────── */
function viewDomainDetail(r, id){
  const d = r.domains.find(x => x.id === id);
  if(!d) return "";
  const p    = projectRun(r, S.fixes);
  const pd   = p.domains.find(x => x.id === id);
  const mine = (r.fixes || []).filter(f => f.domain === id);
  const risks= r.risks.filter(v => v.domain === id);

  // what this domain contributes to the composite, and what it could
  const contribNow  = d.raw * d.w;
  const contribProj = pd.proj * d.w;

  const subs = d.subs.map(s => {
    const absent = s.items.filter(i => i.s === 1);
    return `<tr>
      <td class="mono">${esc(s.id)}</td>
      <td>${esc(s.name)}</td>
      <td class="num t-${s.band}"><b>${s.score}</b></td>
      <td>${esc(s.bandLabel)}</td>
      <td class="dim">${absent.length
        ? absent.length + " item" + (absent.length>1?"s":"") + " scoring 1 — " +
          absent.map(i=>esc(i.name)).join(", ")
        : "no items at level 1"}</td>
    </tr>`;
  }).join("");

  const actions = mine.length ? mine.map(f => {
    const on = S.fixes.has(f.fix_id);
    const solo = r.projection.byFix[f.fix_id];
    const soloD = solo.domains[id];
    const m = tierMeta(f.tier);
    const tip = `${f.fix_id} · sprint ${f.sprint} (days ${(f.sprint-1)*30+1}–${f.sprint*30})`
              + ` · owner ${f.owner} · retires ${f.risk_ref}  —  Done when: ${f.gate}`;
    return `<button class="fix" data-fix="${esc(f.fix_id)}" aria-pressed="${on}">
      <span class="box">${on?"✓":""}</span>
      <span>
        <span class="ttl">${esc(f.title)}
          <span class="tip" tabindex="0" data-tip="${esc(tip)}">i</span></span>
        <span class="desc"><span class="${m.cls}" style="font-weight:600">${m.label}</span>
          · ${esc(f.description)}</span>
      </span>
      <span class="lift">${soloD > d.raw ? "+" + Math.round(soloD - d.raw) : "—"}</span>
    </button>`;
  }).join("") : `<p class="footnote">No 90-day action targets this domain directly.
      It moves when the domains feeding it move.</p>`;

  return `
  <section class="panel" id="domainDetail">
    <div class="panel-head">
      <h3>${d.cp ? "● " : ""}${esc(d.name)}</h3>
      <span class="note">${d.cp ? "Critical path — this domain can set the tier"
                                : "Not critical path — cannot set the tier on its own"}</span>
    </div>
    <div class="panel-body proj" style="padding:0">
      <div class="proj-chart">
        ${radarSVG(p.domains.map(x => ({...x, focus: x.id === id})), 300)}
        <div class="proj-legend"><span>${esc(SHORT[id] || d.name)} highlighted</span></div>
        <div class="proj-headline">
          <span class="k">Domain score</span>
          <span class="now t-${d.band}">${d.score}</span>
          ${Math.round(pd.proj) !== d.score
            ? `<span class="arrow">→</span><span class="to">${Math.round(pd.proj)}</span>` : ""}
          <span class="delta">${esc(bandLabel(pd.proj))}</span>
        </div>
        <div class="proj-headline" style="border-top:none;padding-top:0">
          <span class="k">Adds to the overall score</span>
          <span class="now" style="font-size:15px">${contribNow.toFixed(1)}</span>
          ${contribProj - contribNow > 0.05
            ? `<span class="arrow">→</span>
               <span class="to" style="font-size:15px">${contribProj.toFixed(1)}</span>` : ""}
        </div>
      </div>
      <div class="proj-list">
        <div class="tier-head">The question this domain answers
          <span class="n">${esc(d.northStar || "")}</span></div>
        <div class="tbl-wrap"><table>
          <thead><tr><th></th><th>Subdomain</th><th class="num">Score</th><th>Band</th>
            <th>What is holding it</th></tr></thead>
          <tbody>${subs}</tbody></table></div>
        <div class="tier-head" style="margin-top:16px">90-day actions on this domain
          <span class="n">${mine.length} of ${(r.fixes||[]).length}</span></div>
        ${actions}
        ${risks.length ? `<div class="tier-head" style="margin-top:16px">Scored risks here
          <span class="n">${risks.length}</span></div>
          <div class="tbl-wrap"><table>
            <thead><tr><th>Mechanism</th><th>Risk</th><th class="num">Criticality</th><th>Band</th></tr></thead>
            <tbody>${risks.map(v=>`<tr>
              <td><span class="mech">${esc(v.id)}</span></td>
              <td>${esc(v.desc)}</td>
              <td class="num"><b>${money(v.c)}</b></td>
              <td><span class="pill p-${v.level}">${esc(v.level)}</span></td>
            </tr>`).join("")}</tbody></table></div>` : ""}
        
      </div>
    </div>
  </section>`;
}


/* ── the storyline ────────────────────────────────────────────────────── */
/* Composed from the run's own figures rather than written per company, so it
   stays true when the data changes and works for any company minted later. */
function storyline(r, c){
  const weak  = r.domains.find(d => d.id === r.weakestCP)
             || [...r.domains].filter(d=>d.cp).sort((a,b)=>a.score-b.score)[0];
  const worst = [...r.domains].sort((a,b)=>a.score-b.score)[0];
  const top   = r.risks[0];
  const e     = r.elt;
  const fixes = r.fixes || [];
  const crit  = fixes.filter(f=>f.tier==="critical");
  const s1    = fixes.filter(f=>f.sprint===1);
  const all   = fixes.length ? projectRun(r, new Set(fixes.map(f=>f.fix_id))) : null;
  const base  = projectRun(r, new Set());
  const units = unitsOf(S.co);

  const money0 = n => n >= 1e6 ? "$" + (n/1e6).toFixed(1) + "M" : "$" + Math.round(n/1e3) + "k";
  const runway = r.cfPositive ? "cash-flow positive"
               : r.runway == null ? "no runway figure" : r.runway.toFixed(1) + " months of runway";

  const state = `${esc(c.name)} turns over ${money0(r.fin.annual_revenue)} with ${runway}.
    The assessment scores ${r.itemCount} items against documentary evidence and returns
    <b>${esc(r.tierLabel)}</b> — and the reason is specific: ${esc(r.binding)}.
    ${weak && !r.gateRunway
      ? `${esc(weak.name)} is the weakest load-bearing function at ${weak.score}.`
      : ""}
    ${worst.id !== (weak||{}).id
      ? `The lowest score anywhere is ${esc(worst.name)} at ${worst.score}${worst.cp ? "" : ", which cannot set the tier on its own but blocks the track above"}.`
      : ""}
    ${top ? `The largest single exposure is ${esc(top.desc.toLowerCase())}, at ${money(top.c)} of
      expected annual cost.` : ""}
    ${units.length ? `Scored across ${units.length} ${esc(((DATA.multiUnit||{})[S.co]||{}).label||"locations")},
      the spread runs from ${Math.max(...units.map(u=>u.ami))} down to
      ${Math.min(...units.map(u=>u.ami))}.` : ""}`;

  const team = e ? `The leadership team reads <b>${e.overall} — ${esc(e.overallBand)}</b>.
    ${e.solo.length
      ? `${e.solo.map(x=>esc(x.name)).join(" and ")} ${e.solo.length>1?"hold":"holds"} work nobody
         else can do${e.solo.length===1 && e.solo[0].what.length>1
           ? ` — ${e.solo[0].what.length} separate functions in one seat` : ""}.`
      : "No single function depends on one person."}
    ${e.uncovered.length ? ` Nobody leans ${e.uncovered.map(x=>esc(x)).join(" or ")}.` : ""}
    ${e.drivers.length <= 1 ? ` Directional judgment sits in one seat.` : ""}
    This is a second instrument; it explains the leadership score rather than
    contributing to it.`
    : "No team read has been run for this company.";

  const plan = fixes.length ? `The plan is ${fixes.length} actions —
    ${crit.length} critical, ${s1.length} inside the first thirty days — each with a named owner
    and a gate that has to be evidenced before it counts as done.
    Fully evidenced, the whole register moves the composite from ${Math.round(base.ami)} to
    ${Math.round(all.ami)}.
    ${r.gateRunway
      ? `None of it moves the tier, because the binding reason here is cash, not architecture.
         ${crit.length ? esc(crit[0].title) + " is the action that would." : ""}`
      : `${(() => {
          const changed = all.domains.filter(d => d.cp &&
            bandOf(d.proj) !== bandOf(d.now));
          return changed.length
            ? `That would lift ${changed.map(d=>esc(d.name)).join(" and ")} into a higher band —
               which is what the tier turns on.`
            : `That lifts the shape without moving any load-bearing function into a higher band.`;
        })()}`}`
    : "No 90-day plan has been produced at this evidence level.";

  return `
  <section class="panel story">
    <div class="panel-head"><h3>The short version</h3>
      <span class="note">Composed from this engagement's own figures</span></div>
    <div class="panel-body story-grid">
      <div><div class="story-k">Where the business stands</div><p>${state}</p></div>
      <div><div class="story-k">What the team read adds</div><p>${team}</p></div>
      <div><div class="story-k">The next ninety days</div><p>${plan}</p></div>
    </div>
  </section>`;
}

function viewTeam(){

/* ── the ELT Diagnostic ───────────────────────────────────────────────── */
const eltBandCls = b => b === "high risk" ? "critical" : b === "watch" ? "developing" : "established";

function dimBar(code, natural, adapted){
  const n = natural[code], a = adapted[code], moved = Math.abs(a - n) >= 0.5;
  return `<div class="ldna-row">
    <span class="ldna-code">${esc(code)}</span>
    <span class="ldna-track">
      <span class="ldna-nat" style="left:${n*10}%"></span>
      ${moved ? `<span class="ldna-link" style="left:${Math.min(n,a)*10}%;
        width:${Math.abs(a-n)*10}%"></span>
        <span class="ldna-adp" style="left:${a*10}%"></span>` : ""}
    </span>
    <span class="ldna-val mono">${n.toFixed(1)}${moved ? ` → ${a.toFixed(1)}` : ""}</span>
  </div>`;
}

function memberCard(m){
  const a = m.adaptation;
  const strainLabel = a.strain === "overextension"
      ? "Overextension — running wired, not depleted"
      : a.strain === "depletion" ? "Depletion — pulled below their own baseline" : null;
  return `<div class="ldna-member">
    <div class="ldna-head">
      <div>
        <div class="ldna-name">${esc(m.name)}</div>
        <div class="ldna-role">${esc(m.role)} · ${m.tenure} yr${m.tenure===1?"":"s"}</div>
      </div>
      <div class="ldna-arch">
        <span class="arch-chip">${esc(m.arch)}</span>
        <div class="dim">${esc(m.region)} region</div>
      </div>
    </div>
    <div class="ldna-note">${esc(m.note)}</div>
    <div class="ldna-dims">${DATA.eltDims.map(d=>dimBar(d.code, m.natural, m.adapted)).join("")}</div>
    <div class="ldna-flags">
      ${m.critical_solo ? `<span class="flag crit">Only person who can:
        ${m.critical_solo.map(x=>esc(x)).join(", ")}</span>` : ""}
      ${m.region !== m.demands ? `<span class="flag warn">Leans ${esc(m.region)},
        the seat demands ${esc(m.demands)}</span>` : ""}
      ${strainLabel ? `<span class="flag warn">${esc(strainLabel)}</span>` : ""}
      ${a.caged.length ? `<span class="flag warn">Caged strength:
        ${a.caged.map(c=>`${esc(c.dim)} ${c.natural} held down to ${c.adapted}`).join(", ")}</span>` : ""}
      ${m.flight_risk ? `<span class="flag crit">Actively being recruited</span>` : ""}
      ${m.unheeded ? `<span class="flag warn">Analytical voice without authority</span>` : ""}
    </div>
    <div class="ldna-vf"><b>Multiplies:</b> ${esc(m.value)}
      <br><b>Grinds on:</b> ${esc(m.friction)}</div>
  </div>`;
}

/* The value-stream field. Published archetype coordinates (expert-anchored
   centroids from the manual), with each leader placed against their own
   composites and anchored to that centroid. */
function fieldPlot(e){
  const A = DATA.eltField;
  if(!A || !A.length || !e.members.length) return "";
  const W=900, H=470, L=62, R=26, T=46, B=56;
  const pw=W-L-R, ph=H-T-B;
  const X = v => L + (v/3)*pw;
  const Y = v => T + ((10-v)/10)*ph;

  const used = new Set(e.members.map(m=>m.arch));

  const bands = [["Vision",0,1],["Flow",1,2],["Delivery",2,3]].map(([lab,a,b],i)=>`
    ${i%2===0 ? `<rect class="field-band" x="${X(a)}" y="${T}" width="${X(b)-X(a)}"
      height="${ph}"/>` : ""}
    <text class="field-bandlab" x="${(X(a)+X(b))/2}" y="${T-16}"
      text-anchor="middle">${lab}</text>`).join("");

  const anchors = A.map(a=>{
    const u = used.has(a.name);
    return `<g>
      <circle class="field-anchor${u?" used":""}" cx="${X(a.x)}" cy="${Y(a.y)}" r="4.5"/>
      <text class="field-alab${u?" used":""}" x="${X(a.x)}" y="${Y(a.y)+16}"
        text-anchor="middle">${esc(a.name)}</text>
    </g>`;}).join("");

  // members. Labels are placed against every label already on the plot —
  // archetype names included — so a name never lands on top of another.
  const box = (t, x, y, size) => {
    const w = t.length * size * 0.56;
    return {x0:x-w/2, x1:x+w/2, y0:y-size, y1:y+3};
  };
  const hits = (b, list) => list.some(o =>
    b.x0 < o.x1 && o.x0 < b.x1 && b.y0 < o.y1 && o.y0 < b.y1);
  const taken = A.map(a => box(a.name, X(a.x), Y(a.y)+16, 9.5));

  const people = e.members.map(m=>{
    const nx=X(m.field.x), ny=Y(m.field.y);
    const ax=X(m.fieldAdapted.x), ay=Y(m.fieldAdapted.y);
    const moved = Math.hypot(ax-nx, ay-ny) > 6;
    let dy = -14, b = box(m.name, nx, ny+dy, 11);
    for(const cand of [-14,-27,-40,22,35,-53]){
      dy = cand; b = box(m.name, nx, ny+dy, 11);
      if(!hits(b, taken)) break;
    }
    taken.push(b);
    return `<g>
      ${moved ? `<line class="field-drag" x1="${nx}" y1="${ny}" x2="${ax}" y2="${ay}"/>
        <circle class="field-adp" cx="${ax}" cy="${ay}" r="5"/>` : ""}
      <circle class="field-nat" cx="${nx}" cy="${ny}" r="6"/>
      <text class="field-mlab" x="${nx}" y="${ny+dy}" text-anchor="middle">${esc(m.name)}</text>
    </g>`;}).join("");

  return `<div class="field-wrap">
    <svg viewBox="0 0 ${W} ${H}" role="img"
      aria-label="Value-stream field: fifteen archetypes with each leader plotted.">
      ${bands}
      <line class="field-axis" x1="${L}" y1="${T}" x2="${L}" y2="${T+ph}"/>
      <line class="field-axis" x1="${L}" y1="${T+ph}" x2="${L+pw}" y2="${T+ph}"/>
      ${anchors}
      ${people}
      <text class="field-axlab" x="${L+pw}" y="${T+ph+20}" text-anchor="end">
        generating direction → connecting and coordinating → executing and finishing</text>
      <text class="field-axlab" transform="translate(${L-14},${T+6}) rotate(-90)"
        text-anchor="end">structured and analytical</text>
      <text class="field-axlab" transform="translate(${L-14},${T+ph}) rotate(-90)">
        adaptive and intuitive</text>
      <g transform="translate(${L},${H-14})">
        <circle class="field-nat" cx="6" cy="-4" r="5"/>
        <text class="field-key" x="17" y="0">natural</text>
        <circle class="field-adp" cx="68" cy="-4" r="4.5"/>
        <text class="field-key" x="79" y="0">where the seat pulls them</text>
        <circle class="field-anchor" cx="228" cy="-4" r="4"/>
        <text class="field-key" x="239" y="0">archetype</text>
      </g>
    </svg>
  </div>`;
}

function eltPanel(r){
  const e = r.elt;
  if(!e) return "";
  const dims = e.dimensions.map(d=>`
    <div class="elt-dim">
      <div class="elt-dim-head">
        <span class="elt-key">${esc(d.key)}</span>
        <span class="elt-name">${esc(d.name)}</span>
        <span class="elt-w mono">${Math.round(d.weight*100)}%</span>
        <span class="elt-score t-${eltBandCls(d.band)}">${d.score}</span>
      </div>
      <div class="elt-track"><span class="fill b-${eltBandCls(d.band)}"
        style="width:${d.score}%"></span>
        <span class="tick" style="left:50%"></span><span class="tick" style="left:75%"></span></div>
      <div class="elt-why">${esc(d.why)}</div>
    </div>`).join("");

  const findings = [];
  if(e.solo.length) findings.push(`<b>${e.solo.map(s=>esc(s.name)).join(" and ")}</b>
    ${e.solo.length>1?"each hold":"holds"} work nobody else can do —
    ${e.solo.map(s=>s.what.map(w=>esc(w)).join(", ")).join("; ")}.`);
  if(e.uncovered.length) findings.push(`Nobody on this team leans
    <b>${e.uncovered.map(x=>esc(x)).join(" or ")}</b>. A region the work needs and the bench
    does not cover is a gap that shows up at exactly the wrong moment.`);
  if(e.drivers.length <= 1) findings.push(`Directional judgment sits with
    <b>${e.drivers.length ? esc(e.drivers[0]) : "nobody"}</b> alone. Everything queues behind
    one seat.`);
  if(e.flight && e.flight.length) findings.push(`<b>${e.flight.map(f=>esc(f.name)).join(" and ")}</b>
    ${e.flight.length>1?"are":"is"} being recruited away — the clock on everything above.`);
  if(e.unheeded && e.unheeded.length) findings.push(`<b>${e.unheeded.map(u=>esc(u.name)).join(", ")}</b>

      <p class="footnote">

/* ── wiring ───────────────────────────────────────────────────────── */
function render(keepScroll){
  const y = window.scrollY;
  if(!SHOW_PRACTITIONER) S.lens = "deliverable";
  document.body.dataset.lens = S.lens;
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected", b.dataset.view===S.view));
  document.querySelectorAll("#lensSeg button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.lens===S.lens));
  const tn=document.querySelector("#topNote"); if(tn) tn.textContent = "Synthetic data · engine "+DATA.meta.engine+" · framework "+DATA.meta.framework;
  renderRail();
  const tt = document.querySelector("#teamTab");
  if(tt) tt.hidden = !(run(S.co, "T2") || {}).elt;
  if(S.view==="team" && !(run(S.co, "T2") || {}).elt) S.view = "company";
  const ut = document.querySelector("#unitsTab");
  if(ut){ ut.hidden = !unitsOf(S.co).length;
          ut.textContent = unitsOf(S.co).length ? (((DATA.multiUnit||{})[S.co]||{}).label||"Locations")
              .replace(/^./,ch=>ch.toUpperCase()) : "Locations"; }
  if(S.view==="units" && !unitsOf(S.co).length) S.view = "company";
  $("#main").innerHTML = S.view==="portfolio" ? viewPortfolio()
                       : S.view==="team"      ? viewTeam()
                       : S.view==="units"     ? viewUnits()
                       : S.view==="taxonomy"  ? viewTaxonomy()
                       : S.view==="library"   ? viewLibrary()
                       : S.view==="samples"   ? viewSamples()
                       : viewCompany();
  countUp();
  if(keepScroll) window.scrollTo({top:y}); else window.scrollTo({top:0});
}

/* Counts the hero figure up to its value. Cosmetic only — the number in the
   markup is already the engine's, and it is what remains if this never runs
   or if the reader has asked for reduced motion. */
function countUp(){
  if(window.matchMedia && window.matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  document.querySelectorAll("[data-count]").forEach(el=>{
    const target = Number(el.dataset.count);
    if(!isFinite(target)) return;
    const t0 = performance.now(), ms = 620;
    const tick = now => {
      const p = Math.min(1, (now - t0)/ms);
      el.textContent = Math.round(target * (1 - Math.pow(1-p, 3)));
      if(p < 1) requestAnimationFrame(tick); else el.textContent = target;
    };
    requestAnimationFrame(tick);
  });
}

document.addEventListener("click", e=>{
  const tab = e.target.closest(".tab");
  if(tab){ S.view = tab.dataset.view; return render(); }
  const lens = e.target.closest("#lensSeg button");
  if(lens){ S.lens = lens.dataset.lens; return render(true); }
  const c = e.target.closest("[data-co]");
  if(c){ S.co = c.dataset.co; S.doc = null; S.fixes = new Set(); S.domain = null; S.unit = null; if(S.view!=="library") S.view="company"; return render(); }
  const g = e.target.closest("[data-goto]");
  if(g){ S.co = g.dataset.goto; S.doc = null; S.fixes = new Set(); S.domain = null; S.unit = null; S.view="company"; return render(); }
  const d = e.target.closest("[data-doc]");
  if(d){ S.doc = d.dataset.doc; return render(true); }
  const un = e.target.closest("[data-unit]");
  if(un){ S.unit = (S.unit === un.dataset.unit) ? null : un.dataset.unit; return render(true); }
  const dm = e.target.closest("[data-domain]");
  if(dm){ S.domain = (S.domain === dm.dataset.domain) ? null : dm.dataset.domain;
    return render(true); }
  const fx = e.target.closest("[data-fix]");
  if(fx){ const id = fx.dataset.fix;
    S.fixes.has(id) ? S.fixes.delete(id) : S.fixes.add(id); return render(true); }
  const ps = e.target.closest("[data-fixset]");
  if(ps){
    const all = run(S.co, S.snap).fixes || [];
    const keep = {none:[], critical:["critical"], high:["critical","high"],
                  all:["critical","high","medium","low"]}[ps.dataset.fixset];
    S.fixes = new Set(all.filter(f=>keep.includes(f.tier)).map(f=>f.fix_id));
    return render(true);
  }
  const st = e.target.closest("[data-snap]");
  if(st){ S.snap = st.dataset.snap; S.fixes = new Set(); S.domain = null; return render(); }
});

function boot(d){
  DATA = d;
  S.co = DATA.companies[0].code;
  document.querySelector(".shell").style.display = "";
  render();
}

/* The hosted build ships its payload in data.js, AES-GCM encrypted. GitHub Pages
   has no server-side auth, so the passphrase is not a curtain over readable data —
   without it the payload does not decrypt. Synthetic data only, either way. */
async function unlock(pass, enc){
  if(!window.isSecureContext || !(window.crypto && window.crypto.subtle)){
    const e = new Error("insecure-context"); e.code = "insecure-context"; throw e;
  }
  const b = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass),
                                             "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b(enc.salt), iterations:enc.iters, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b(enc.iv)}, key, b(enc.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}

function initGate(enc){
  const shell = document.querySelector(".shell");
  shell.style.display = "none";
  const wrap = document.createElement("div");
  wrap.className = "gate-screen";
  wrap.innerHTML = `<div class="gate-card">
    <h1>BAIC Sandbox</h1>
    <div class="sub">Vertical Architecture Intensive · demo</div>
    <p>A demonstration environment built on synthetic companies. Nothing here is a client.
       Enter the passphrase to open it.</p>
    <input id="pw" type="password" autocomplete="off" autofocus placeholder="Passphrase">
    <p id="ctxNote" style="display:none;margin:12px 0 0;font-size:11.5px;color:var(--flag)"></p>
    <button class="go" id="goBtn">Open the sandbox</button>
    <div class="gate-err" id="gerr"></div>
  </div>`;
  document.body.appendChild(wrap);
  const go = async () => {
    const btn = document.querySelector("#goBtn"), err = document.querySelector("#gerr");
    btn.disabled = true; err.textContent = "";
    try{
      const d = await unlock(document.querySelector("#pw").value, enc);
      wrap.remove(); boot(d);
    }catch(e){
      err.innerHTML = e && e.code === "insecure-context"
        ? "This page decrypts in the browser, which needs a secure context. Opening the file "
          + "straight off disk (<code>file://</code>) will not work no matter what you type. "
          + "Serve it over <b>https</b> \u2014 or locally with "
          + "<code>python3 -m http.server</code> and open <code>localhost:8000</code>."
        : "That passphrase does not open this file. Check it and try again.";
      btn.disabled = false; document.querySelector("#pw").select();
    }
  };
  if(!window.isSecureContext || !(window.crypto && window.crypto.subtle)){
    const n = document.querySelector("#ctxNote");
    n.style.display = "block";
    n.innerHTML = "Heads up: this page is not running in a secure context, so the browser's "
      + "decryption API is unavailable and no passphrase will open it. Serve it over https, "
      + "or locally with <code>python3 -m http.server</code>.";
  }
  document.querySelector("#goBtn").addEventListener("click", go);
  document.querySelector("#pw").addEventListener("keydown", e=>{ if(e.key==="Enter") go(); });
}

if(EMBEDDED) boot(EMBEDDED);
else if(window.__BAIC_ENC) initGate(window.__BAIC_ENC);
else document.querySelector(".shell").innerHTML =
  '<p style="padding:40px">No data payload found. Expected an inlined build or data.js alongside this page.</p>';
</script>
